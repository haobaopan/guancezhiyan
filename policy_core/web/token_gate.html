<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需要访问令牌 · 管策智研</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6f8;
font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#111a22}
.box{background:#fff;border:1px solid #e2e8ed;border-radius:16px;padding:34px 36px;max-width:470px;width:calc(100% - 44px);
box-shadow:0 10px 30px rgba(16,32,48,.08)}
h1{margin:0 0 8px;font-size:21px;color:#0e3350}
p{margin:0 0 18px;color:#42525f;font-size:14.5px}
input{width:100%;box-sizing:border-box;padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-size:14.5px}
input:focus{outline:2px solid #b6d9df;border-color:#0f7d8c}
button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:#14506f;color:#fff;
font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#0f405b}
.tip{margin:16px 0 0;font-size:12.5px;color:#7b8b98;line-height:1.7}
</style>
<div class="box">
<h1>需要访问令牌</h1>
<p>「管策智研」部署在校内网络上，需凭令牌进入。请向管理员索取访问令牌。</p>
<form method="get" action="/">
<input name="token" placeholder="粘贴访问令牌" autocomplete="off" autofocus>
<button type="submit">进入</button>
</form>
<p class="tip">令牌校验通过后本页会记住它；把带令牌的地址存成书签，下次可直接进入。令牌等同于钥匙，不要转发给无关人员。</p>
</div>
</html>
